# Combine with compose.yaml and compose.oidc.yaml. Models are downloaded once into a volume.
services:
  ollama:
    image: ollama/ollama:latest
    volumes: ["ollamadata:/root/.ollama"]
    environment:
      OLLAMA_NUM_PARALLEL: "1"
      OLLAMA_MAX_LOADED_MODELS: "1"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 3s
      timeout: 5s
      retries: 40
  ollama-models:
    image: ollama/ollama:latest
    entrypoint: ["/bin/sh", "-c"]
    command: ['ollama pull "$$CHAT_MODEL" && ollama pull "$$EMBEDDING_MODEL"']
    environment:
      OLLAMA_HOST: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
    depends_on:
      ollama:
        condition: service_healthy
  backend:
    environment:
      PROVIDER: ollama
      OLLAMA_BASE_URL: http://ollama:11434
      CHAT_MODEL: ${CHAT_MODEL:-qwen2.5:3b}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-nomic-embed-text}
      REQUEST_TIMEOUT: "180"
    depends_on:
      ollama-models:
        condition: service_completed_successfully
volumes:
  ollamadata:
