name: Verify workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e ./backend
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@localhost:5432/workbench
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  compose-smoke:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        auth: [demo, oidc]
    env:
      AUTH_TEST_MODE: ${{ matrix.auth }}
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Start demo or OIDC stack
        run: |
          if [ "$AUTH_TEST_MODE" = "oidc" ]; then
            docker compose -f compose.yaml -f compose.oidc.yaml up -d --build
            for attempt in $(seq 1 90); do
              if curl --fail --silent http://localhost:8180/realms/workbench/.well-known/openid-configuration > /dev/null; then break; fi
              sleep 2
            done
            curl --fail --silent http://localhost:8180/realms/workbench/.well-known/openid-configuration > /dev/null
          else
            docker compose up -d --build
          fi
      - name: Verify packaged application through Nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/ | grep -q 'Enterprise AI Workbench'
          if [ "$AUTH_TEST_MODE" = "oidc" ]; then exit 0; fi
          curl --fail --silent http://localhost:8080/api/chat \
            -H 'Authorization: Bearer demo-ops' \
            -H 'Content-Type: application/json' \
            -d '{"question":"Como investigar erros na API de pedidos?","include_metrics":true}' > /tmp/result.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/result.json'))
          assert result['citations']
          assert result['metrics']['synthetic'] is True
          assert result['tool_calls'][0]['transport'] == 'MCP stdio'
          print('PASS Compose → Nginx → API → RAG + MCP')
          PY
      - name: Browser profiles, editing, MCP and architecture
        run: npm run test:e2e
        working-directory: frontend
      - name: Container diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.oidc.yaml logs
      - name: Clean up
        if: always()
        run: docker compose -f compose.yaml -f compose.oidc.yaml down -v
  ollama-real-smoke:
    if: contains(github.event.head_commit.message, '[ollama-smoke]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CHAT_MODEL: qwen2.5:3b
      EMBEDDING_MODEL: nomic-embed-text
    steps:
      - uses: actions/checkout@v4
      - name: Configure isolated synthetic identity
        run: |
          cp .env.example .env
          python - <<'PY'
          import json,secrets
          from pathlib import Path
          p=Path('.env')
          lines=[line for line in p.read_text().splitlines() if not line.startswith('AUTH_TOKENS=')]
          lines.append('AUTH_TOKENS='+json.dumps({secrets.token_urlsafe(32):['query-l2']}))
          p.write_text('\n'.join(lines)+'\n')
          PY
      - name: Build and download real models
        run: docker compose -f compose.yaml -f compose.ollama.yaml up -d --build
      - name: Real embeddings, generation, authorization and MCP
        run: python scripts/smoke_ollama.py
      - name: Record Ollama version and model inventory
        if: always()
        run: |
          docker compose -f compose.yaml -f compose.ollama.yaml exec -T ollama ollama --version
          docker compose -f compose.yaml -f compose.ollama.yaml exec -T ollama ollama list
      - name: Diagnostics
        if: failure()
        run: docker compose -f compose.yaml -f compose.ollama.yaml logs
      - name: Cleanup
        if: always()
        run: docker compose -f compose.yaml -f compose.ollama.yaml down -v
