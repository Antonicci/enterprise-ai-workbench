name: Verify workbench
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: workbench
          POSTGRES_PASSWORD: workbench
          POSTGRES_DB: workbench
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U workbench"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements.lock
      - run: pip install -r backend/requirements.lock
      - run: pip install --no-deps -e ./backend
      - run: python -m pytest backend/tests -q
        env:
          TEST_DATABASE_URL: postgresql://workbench:workbench@localhost:5432/workbench
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build
  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: cp .env.example .env
      - run: docker compose up -d --build
      - name: Verify packaged application through Nginx
        run: |
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:8080/health; then break; fi
            sleep 2
          done
          curl --fail --silent http://localhost:8080/ | grep -q 'Enterprise AI Workbench'
          curl --fail --silent http://localhost:8080/api/chat \
            -H 'Authorization: Bearer demo-ops' \
            -H 'Content-Type: application/json' \
            -d '{"question":"Como investigar erros na API de pedidos?","include_metrics":true}' > /tmp/result.json
          python - <<'PY'
          import json
          result = json.load(open('/tmp/result.json'))
          assert result['citations']
          assert result['metrics']['synthetic'] is True
          assert result['tool_calls'][0]['transport'] == 'MCP stdio'
          print('PASS Compose → Nginx → API → RAG + MCP')
          PY
      - name: Container diagnostics
        if: failure()
        run: docker compose logs
      - name: Clean up
        if: always()
        run: docker compose down -v
