log_format workbench_safe '$remote_addr $request_method $uri $status';
server {
  listen 80;
  server_name _;
  access_log /var/log/nginx/access.log workbench_safe;
  root /usr/share/nginx/html;
  client_max_body_size 256k;
  add_header X-Content-Type-Options nosniff always;
  add_header Referrer-Policy no-referrer always;
  add_header X-Frame-Options DENY always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'self' https: http://localhost:8180; img-src 'self' data:; frame-ancestors 'none'" always;
  location /api/ {
    proxy_pass http://backend:8000;
    proxy_read_timeout 190s;
  }
  location /health { proxy_pass http://backend:8000; }
  location / { try_files $uri /index.html; }
}
